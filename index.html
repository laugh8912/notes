<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EDF1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>项目手记</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<style>
:root{
  --paper:#E9EDF1; --sheet:#F7F9FB; --ink:#1D2733; --ink-2:#5A6675; --ink-3:#7A8592;
  --rule:#D5DCE3; --pen:#25615C; --pen-soft:#E1EEEC; --warn:#B4532A; --warn-soft:#F6E6DC;
  --gold:#C98B1E;
  --hand:"LXGW WenKai GB Screen","LXGW WenKai Screen","LXGW WenKai","Kaiti SC","STKaiti","KaiTi",serif;
  --sans:-apple-system,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

/* header */
.top{padding:22px 2px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-family:var(--hand);font-weight:700;font-size:28px;letter-spacing:1px;line-height:1.1}
.top .date{font-family:var(--mono);font-size:12px;color:var(--ink-2);letter-spacing:.5px;text-align:right}
.sub{color:var(--ink-2);font-size:13px;margin:0 2px 16px}

/* nudges */
.nudge{background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--gold);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.nudge .hand{font-family:var(--hand);font-size:16px;color:var(--ink);flex:1}
.nudge button{color:var(--pen);font-size:13px;white-space:nowrap;padding:2px 0}

/* section title */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.sec h2{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:2px}
.sec button{font-size:13px;color:var(--pen)}

/* project tabs strip */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:6px 12px;border-radius:999px;background:var(--sheet);border:1px solid var(--rule);font-size:13px;display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.tab.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

/* project cards */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 12px 12px 16px;text-align:left;overflow:hidden;min-height:118px;display:flex;flex-direction:column}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.pcard .cat{font-size:11px;color:var(--ink-3);letter-spacing:1px}
.pcard .nm{font-weight:600;font-size:16px;line-height:1.3;margin:2px 0 auto}
.pcard .meta{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:10px;line-height:1.5}
.pcard .stale{color:var(--warn)}
.pcard.add{border-style:dashed;align-items:center;justify-content:center;color:var(--ink-2);font-size:14px}
.pcard.add::before{display:none}

/* entry card */
.day{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin:20px 2px 8px;letter-spacing:1px;display:flex;align-items:center;gap:10px}
.day::after{content:"";flex:1;height:1px;background:var(--rule)}
.entry{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px 14px 12px 18px;margin-bottom:10px;overflow:hidden}
.entry::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.ehead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.ehead .pn{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
.ehead .tm{font-family:var(--mono);color:var(--ink-3)}
.etext{white-space:pre-wrap;word-break:break-word;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--paper);color:var(--ink-2);line-height:1.6}
.chip b{font-weight:600;color:var(--ink);margin-right:4px}
.chip.block{background:var(--warn-soft);color:var(--warn)}
.chip.block b{color:var(--warn)}
.chip.solved{background:var(--pen-soft);color:var(--pen);text-decoration:line-through;text-decoration-thickness:1px}
.chip.solved b{color:var(--pen);text-decoration:none}
.chip.idea b{color:var(--gold)}

/* signature: margin note */
.note{margin-top:12px;padding:10px 0 2px 14px;border-left:2px solid var(--pen);position:relative}
.note .who{font-size:11px;letter-spacing:2px;color:var(--pen);margin-bottom:2px;font-family:var(--sans)}
.note .txt{font-family:var(--hand);color:var(--pen);font-size:17px;line-height:1.75;white-space:pre-wrap}
.note.wait .txt{color:var(--ink-3)}
.note.err{border-color:var(--warn)}
.note.err .txt,.note.err .who{color:var(--warn);font-family:var(--sans);font-size:13px}
.thread{margin-top:8px}
.note.light{padding-top:6px}
.note.light .who{display:none}
.quiet{margin-top:10px;font-size:12px;color:var(--ink-3)}
.quiet button{color:var(--pen);font-size:12px}
.opener{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:14px 16px 12px;margin:4px 0 12px;position:relative}
.opener .who{font-size:11px;letter-spacing:2px;color:var(--pen);margin-bottom:4px}
.opener .txt{font-family:var(--hand);color:var(--pen);font-size:18px;line-height:1.75;white-space:pre-wrap}
.opener.wait .txt{color:var(--ink-3)}
.opener .acts{display:flex;gap:16px;margin-top:8px;font-size:13px}
.opener .acts button{color:var(--pen)}
.opener .acts button.sub2{color:var(--ink-3)}
.seg button.auto{border-style:dashed}
.seg button.auto.on{border-style:solid}
.toggle{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--ink-2);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--pen)}
.seg-card{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fff}
.seg-card textarea{width:100%;border:none;outline:none;resize:vertical;min-height:64px;line-height:1.7;background:transparent}
.seg-card .seg{margin-top:6px}
.seg-card .seg button{padding:4px 10px;font-size:12px}
.seg-card .why{font-size:12px;color:var(--ink-3);margin-bottom:4px}
.seg-card.drop{opacity:.45}
.thread .me{font-size:14px;color:var(--ink);background:var(--paper);border-radius:8px;padding:6px 10px;margin:8px 0 0 auto;width:fit-content;max-width:88%;white-space:pre-wrap}
.eacts{display:flex;gap:16px;margin-top:10px;font-size:12px}
.eacts button{color:var(--ink-2);padding:4px 0}
.eacts button:hover{color:var(--pen)}
.replybox{display:flex;gap:8px;margin-top:8px}
.replybox input{flex:1;border:1px solid var(--rule);border-radius:8px;padding:7px 10px;background:#fff}
.replybox button{background:var(--pen);color:#fff;border-radius:8px;padding:0 14px;font-size:13px}

/* lists */
.item{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.item .ck{width:20px;height:20px;border:1.5px solid var(--warn);border-radius:5px;flex:none;margin-top:2px;display:grid;place-items:center;color:#fff;font-size:12px}
.item.done .ck{background:var(--pen);border-color:var(--pen)}
.item.done .it{color:var(--ink-3);text-decoration:line-through}
.item .it{flex:1;font-size:14px}
.item .from{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:5px;margin-top:2px}
.empty{text-align:center;color:var(--ink-2);padding:36px 12px;font-size:14px}
.empty .hand{font-family:var(--hand);font-size:19px;color:var(--ink);display:block;margin-bottom:6px}

/* project detail */
.phead{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.phead::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--c)}
.phead h2{font-size:22px;margin-top:4px}
.phead .goal{color:var(--ink-2);font-size:14px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--paper);border-radius:8px;padding:8px 10px}
.stat .n{font-family:var(--mono);font-size:17px;font-weight:600}
.stat .l{font-size:11px;color:var(--ink-2)}
.memo{margin-top:12px;font-family:var(--hand);color:var(--pen);font-size:15px;border-top:1px dashed var(--rule);padding-top:10px}
.memo span{font-family:var(--sans);font-size:11px;letter-spacing:2px;display:block;color:var(--ink-3)}
.back{font-size:14px;color:var(--ink-2);padding:18px 2px 10px;display:inline-block}
.prow{display:flex;gap:14px;margin-top:12px;font-size:13px}
.prow button{color:var(--pen)}

/* fab + nav */
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ink);color:var(--sheet);border-radius:999px;padding:12px 20px;font-size:15px;font-weight:600;box-shadow:0 6px 18px rgba(29,39,51,.25);display:flex;gap:6px;align-items:center;z-index:20}
.fab span{font-family:var(--hand);font-size:18px;font-weight:400}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(247,249,251,.94);backdrop-filter:blur(10px);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom);z-index:15}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{padding:10px 0 9px;font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button i{font-style:normal;font-size:17px;line-height:1}
nav button.on{color:var(--ink);font-weight:600}
nav .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--warn);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:15px;font-weight:600}

/* sheet modal */
.mask{position:fixed;inset:0;background:rgba(29,39,51,.35);z-index:30;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{background:var(--sheet);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{font-size:14px;color:var(--ink-3);font-weight:400}
label.f{display:block;font-size:12px;color:var(--ink-2);margin:12px 0 5px;letter-spacing:1px}
.inp,textarea.inp,select.inp{width:100%;border:1px solid var(--rule);background:#fff;border-radius:10px;padding:10px 12px;outline:none}
.inp:focus{border-color:var(--pen)}
textarea.inp{min-height:150px;resize:vertical;line-height:1.7;background:#fff repeating-linear-gradient(transparent 0 26.5px,#EDF1F4 26.5px 27.5px);background-attachment:local;background-position:0 9px}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid transparent}
.colors button.on{border-color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:6px 12px;border:1px solid var(--rule);border-radius:999px;font-size:13px;background:#fff;display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.primary{width:100%;margin-top:18px;background:var(--ink);color:var(--sheet);border-radius:12px;padding:13px;font-weight:600;font-size:16px}
.primary:disabled{opacity:.4}
.ghost{width:100%;margin-top:10px;border:1px solid var(--rule);border-radius:12px;padding:11px;font-size:14px;color:var(--ink-2);background:#fff}
.danger{color:var(--warn)}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px;margin-bottom:12px}
.card p{font-size:13px;color:var(--ink-2)}
.persona{display:grid;gap:8px}
.persona button{text-align:left;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:#fff}
.persona button.on{border-color:var(--pen);background:var(--pen-soft)}
.persona b{display:block;font-size:14px}
.persona small{color:var(--ink-2);font-size:12px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:999px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.review{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.review .rt{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-bottom:6px}
.review .txt{font-family:var(--hand);color:var(--pen);font-size:16px;line-height:1.8;white-space:pre-wrap}
.entry::before{background:var(--bar,var(--c))}
.pns{display:flex;flex-wrap:wrap;gap:4px 12px}
.ehead .pns .pn{font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
.chip .dot{display:inline-block;width:6px;height:6px;margin-right:4px;vertical-align:middle}
.rate{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;font-family:var(--sans)}
.rate button{color:var(--ink-2);font-size:12px;padding:4px 10px;border:1px solid var(--rule);border-radius:999px;background:#fff}
.rate button.on{color:#fff;background:var(--pen);border-color:var(--pen);font-weight:600}
.rate button.on.bad{background:var(--warn);border-color:var(--warn)}
.rate .why{color:var(--ink-3)}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.reasons button{font-size:12px;padding:3px 10px;border:1px solid var(--rule);border-radius:999px;background:#fff;color:var(--ink-2)}
.memo{white-space:pre-wrap;line-height:1.75}
.voice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;min-height:40px}
.voice .mic{display:flex;align-items:center;gap:6px;background:var(--pen);color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.voice .vhint{font-size:12px;color:var(--ink-2);flex:1;min-width:140px}
.voice .vhint.err{color:var(--warn)}
.voice.rec{background:var(--warn-soft);border-radius:12px;padding:8px 10px}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--warn);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.rectime{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--warn)}
.voice .stopbtn{background:var(--ink);color:var(--sheet);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.voice .cancelbtn{color:var(--ink-2);font-size:13px}
.spin{width:14px;height:14px;border:2px solid var(--rule);border-top-color:var(--pen);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.recdot,.spin{animation:none}}
.vfab{position:fixed;right:calc(max(18px,calc(50% - 262px)) + 132px);bottom:calc(76px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;background:var(--pen);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(37,97,92,.3);z-index:20}
.ltabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 12px}
.lgroup{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.glabel{font-size:11px;letter-spacing:2px;color:var(--ink-3);padding:0 4px}
.ltab{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--ink-2);text-align:left;position:relative}
.ltab b{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink-3)}
.ltab.on{background:var(--ink);color:var(--sheet)}
.ltab.on b{color:var(--sheet)}
.ltab .hot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.filters{margin-bottom:12px}
.frow{display:flex;align-items:center;gap:8px}
.frow .tabs{flex:1;min-width:0;padding-bottom:4px}
.flabel{font-size:12px;color:var(--ink-3);flex:none;width:28px}
.tab.sm{padding:4px 10px;font-size:12px;background:#fff;color:var(--ink);border-color:#C9D1DA}
.tab.sm.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.item .ico{font-size:15px;line-height:1.5;flex:none}
.iacts{display:flex;align-items:center;gap:12px;margin-top:6px}
.iacts .mini{font-size:12px;color:var(--pen)}
.iacts .star{font-size:16px;line-height:1;color:var(--ink-3)}
.iacts .star.on{color:var(--gold)}
.item.idea.project .it,.item.idea.drop .it{color:var(--ink-3)}
.item.idea.drop .it{text-decoration:line-through}
.fold{display:block;width:100%;text-align:center;font-size:13px;color:var(--ink-2);padding:10px 0;margin:4px 0 8px;border-top:1px dashed var(--rule)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<button class="vfab" id="vfab" data-act="quickvoice" aria-label="说一段"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg></button>
<button class="fab" id="fab" aria-label="写一笔">＋ <span>写一笔</span></button>
<nav><div class="in" id="nav"></div></nav>
<div class="mask" id="mask"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 常量 ============ */
const KEY='xmsj_v1';
const COLORS=['#3E6FB0','#2F8F7A','#C0603A','#8A5BB5','#C79A24','#4F5D6E','#C2457A','#6C8F2E'];
const CATS=['工作','爱好','学习','副业','生活','其他'];
const TYPES={progress:'进展',gain:'收获',cost:'付出',blocker:'磕绊',idea:'灵感',note:'其他'};
const MOODS={good:'不错',neutral:'平稳',low:'有点低落',very_low:'很低落'};
const TONES={
  soft:{label:'温柔',line:'- 可以好奇、可以开玩笑；有不同看法时说得很委婉，先肯定再提。不说教、不催促、不评判。'},
  mid:{label:'适中',line:'- 可以好奇、可以开玩笑、可以温和地提出不同看法；不说教、不催促、不评判。'},
  direct:{label:'直接',line:'- 可以好奇、可以开玩笑；看到问题就直接指出来，不绕弯子，但底色是支持。不说教、不催促、不评判。'}
};
const BAD_REASONS=['太长','夸得空','没说到点上','不想要建议','记错了','太像套路'];
const PRESETS={
  deepseek:{label:'DeepSeek',base:'https://api.deepseek.com',model:'deepseek-flash'},
  qwen:{label:'通义千问',base:'https://dashscope.aliyuncs.com/compatible-mode/v1',model:'qwen-plus'},
  kimi:{label:'Kimi',base:'https://api.moonshot.cn/v1',model:'moonshot-v1-8k'},
  custom:{label:'自定义',base:'',model:''}
};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DAY=864e5;

/* ============ 数据层 ============ */
function blank(){return {v:3,projects:[],logs:[],blockers:[],reviews:[],feedback:[],opener:null,
  settings:{preset:'deepseek',base:PRESETS.deepseek.base,model:PRESETS.deepseek.model,key:'',aiName:'小记',nick:'',tone:'mid'}};}
function load(){
  let d=null;try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!d||!d.projects)return blank();
  return d.v===3?fixup(d):migrate(d);
}
function fixup(d){const b=blank();d.settings={...b.settings,...d.settings};['logs','blockers','reviews','feedback'].forEach(k=>d[k]=d[k]||[]);
  d.projects.forEach(p=>{p.followUps=p.followUps||[];p.profiling=false;});return d;}
function migrate(d){
  const n=blank();const os=d.settings||{};
  Object.assign(n.settings,{preset:os.preset||'deepseek',base:os.base||n.settings.base,model:os.model==='deepseek-chat'?'deepseek-flash':(os.model||n.settings.model),key:os.key||'',nick:os.nick||''});
  n.projects=(d.projects||[]).map(p=>({id:p.id,name:p.name,desc:p.goal||'',cat:p.cat||'其他',color:p.color||COLORS[0],created:p.created||Date.now(),archived:!!p.archived,
    profile:p.summary||'',profileTs:p.summary?Date.now():0,followUps:[],lastAsked:0,spendAlerted:''}));
  const moodMap={'开心':'good','兴奋':'good','平稳':'neutral','疲惫':'low','焦虑':'low','沮丧':'low'};
  (d.entries||[]).forEach(e=>{
    const a=e.ai||{};const items=[];
    const add=(type,content,x={})=>items.push({id:uid('i'),pid:e.pid,type,content,minutes:null,money:null,resolves:null,mentions:null,...x});
    (a.progress||[]).forEach(t=>add('progress',t));(a.gain||[]).forEach(t=>add('gain',t));(a.ideas||[]).forEach(t=>add('idea',t));
    (a.blocks||[]).forEach(b=>{const id=b.id||uid('b');add('blocker',b.text,{blockerId:id});
      n.blockers.push({id,pid:e.pid,content:b.text,solved:!!b.solved,first:e.ts,last:e.ts,solvedTs:b.solvedTs||null,logId:e.id});});
    if(e.minutes||e.money)add('cost','投入',{minutes:e.minutes||null,money:e.money||null});
    if(!items.length)add('note',String(e.text||'').slice(0,60));
    const ok=e.status==='done';
    n.logs.push({id:e.id,ts:e.ts,raw:e.text,items,mood:moodMap[a.mood]||'neutral',mode:e.quiet?'log_only':'normal',forcePid:null,
      reply:a.reply||'',status:ok?'done':'error',stage:'split',err:ok?'':'旧版本里没完成的记录，点「重试」。',thread:e.thread||[]});
  });
  n.reviews=(d.reviews||[]).filter(r=>r.status==='done').map(r=>({...r,week:weekKey(r.ts)}));
  return n;
}
let S=load();
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
const P=id=>S.projects.find(p=>p.id===id);
const B=id=>S.blockers.find(b=>b.id===id);
const L=id=>S.logs.find(l=>l.id===id);
const activeProjects=()=>S.projects.filter(p=>!p.archived);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());};
const daysAgo=t=>Math.round((new Date(dkey(Date.now()))-new Date(dkey(t)))/DAY);
const WEEK='日一二三四五六';
function dayLabel(k){const n=daysAgo(k);const w='周'+WEEK[new Date(k).getDay()];return n===0?'今天 · '+w:n===1?'昨天 · '+w:k.slice(5).replace('-','月')+'日 · '+w;}
function fmtMin(m){if(!m)return '0h';const h=m/60;return h>=10?Math.round(h)+'h':(Math.round(h*10)/10)+'h';}
function fmtMoney(v){if(!v)return '¥0';return '¥'+(v>=10000?(Math.round(v/1000)/10)+'万':Math.round(v));}
function weekKey(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d);}
function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}
const logPids=l=>[...new Set((l.items||[]).map(i=>i.pid).filter(id=>id&&P(id)))];

function projStats(pid){
  let min=0,money=0,last=0,count=0;
  S.logs.forEach(l=>{if(l.status==='confirm')return;const its=l.items.filter(i=>i.pid===pid);if(!its.length)return;count++;last=Math.max(last,l.ts);
    its.forEach(i=>{min+=+i.minutes||0;money+=+i.money||0;});});
  return {count,min,money,last,open:S.blockers.filter(b=>b.pid===pid&&!b.solved).length};
}
function sumRange(pid,from,to){let min=0,money=0;S.logs.forEach(l=>{if(l.ts<from||l.ts>=to||l.status==='confirm')return;
  l.items.forEach(i=>{if(i.pid===pid){min+=+i.minutes||0;money+=+i.money||0;}});});return {min,money};}
function allIdeas(){const r=[];S.logs.forEach(l=>{if(l.status==='confirm')return;l.items.forEach(i=>{if(i.type==='idea'&&i.pid&&P(i.pid))r.push({id:i.id,text:i.content,pid:i.pid,ts:l.ts,state:i.ideaState||'new',toPid:i.toPid||null});});});return r.sort((a,b)=>b.ts-a.ts);}
function allGains(){const r=[];S.logs.forEach(l=>{if(l.status==='confirm')return;l.items.forEach(i=>{if(i.type==='gain'&&i.pid&&P(i.pid))r.push({id:i.id,text:i.content,pid:i.pid,ts:l.ts});});});return r.sort((a,b)=>b.ts-a.ts);}
function findItem(id){for(const l of S.logs)for(const i of l.items)if(i.id===id)return i;return null;}
function attentionCount(){const today=dkey(Date.now());
  return S.blockers.filter(b=>!b.solved&&P(b.pid)&&!P(b.pid).archived&&daysAgo(b.first)>=3).length+activeProjects().reduce((n,p)=>n+p.followUps.filter(f=>!f.done&&f.due<=today).length,0);}

/* ============ AI 基础 ============ */
async function chat(messages,temperature=0.7){
  const st=S.settings;
  if(!st.key)throw new Error('还没有填写 API Key，到「设置」里填一下就能收到回应。');
  const base=st.base.replace(/\/+$/,'');
  const url=/\/chat\/completions$/.test(base)?base:base+'/chat/completions';
  const body={model:st.model,messages,temperature};
  if(/deepseek\.com/.test(base))body.thinking={type:'disabled'};
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+st.key},body:JSON.stringify(body)});
  if(!r.ok){let t='';try{t=(await r.json()).error?.message||'';}catch(e){}throw new Error('AI 接口返回 '+r.status+(t?'：'+t:'')+'。检查 Key、模型名和余额。');}
  const j=await r.json();return (j.choices?.[0]?.message?.content||'').trim();
}
function parseJSON(t){
  t=t.replace(/```json|```/g,'').trim();
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<0)throw new Error('AI 返回格式不对，点「重试」再试一次。');
  return JSON.parse(t.slice(a,b+1));
}
function persona(){
  const st=S.settings;const nm=st.aiName||'小记';
  return `你是"${nm}"，用户的项目伙伴。${st.nick?`你称呼用户为"${st.nick}"。`:''}用户同时在推进好几个项目（工作、爱好、副业、学习），每天会把进展、收获、付出、磕绊和灵感随手记给你。

【你是谁】
- 一个记得 TA 所有项目来龙去脉的老朋友，不是老师、教练或客服。
- 你真正提供的是"被关注"：TA 写了，就有人认真看了、记住了、接住了。

【说话方式】
- 像微信聊天：口语、简短，不用标题和列表，不堆表情符号。
- 具体胜过空泛：引用 TA 说过的细节、数字、上次的情况；不说"加油""你真棒"这类空话。
- 夸要夸到点上：指出哪一步难、和之前比哪里变了；不夸大。
- 建议最多一条，并且只在 TA 卡住或主动问时给。
${TONES[st.tone||'mid'].line}

【底线】
- 不编造 TA 没说过的事。记不清就直说，或者问 TA。
- TA 情绪明显低落时，只陪伴，不分析、不给方案。
- 如果 TA 流露出伤害自己的念头，认真关心 TA，并建议 TA 联系身边信任的人或专业帮助。
- 提到钱和时间时，只陈述事实，问一句是否在计划内，不评判 TA 的选择。`;
}
function profilesText(pids){return pids.map(id=>{const p=P(id);return p?`「${p.name}」（${p.desc||p.cat}）\n${p.profile||'（档案还是空的）'}`:'';}).filter(Boolean).join('\n\n')||'（无）';}
function openBlockersText(pids){
  const bs=S.blockers.filter(b=>!b.solved&&(!pids||pids.includes(b.pid))&&P(b.pid));
  return bs.map(b=>`- [${b.id}] 「${P(b.pid).name}」${b.content}（已持续 ${daysAgo(b.first)} 天，最近一次提到是 ${daysAgo(b.last)} 天前）`).join('\n')||'（无）';
}
function feedbackText(){
  const fb=[...S.feedback].sort((a,b)=>b.ts-a.ts);
  const bad=fb.filter(f=>f.v==='bad').slice(0,5),good=fb.filter(f=>f.v==='good'&&f.reason).slice(0,3);
  if(!bad.length&&!good.length)return '';
  return '\n【TA 对你过去回应的评价，请据此调整】\n'+bad.map(f=>`- 不喜欢：「${f.text.slice(0,50)}」原因：${f.reason||'没说'}`).join('\n')+(good.length?'\n'+good.map(f=>`- 喜欢：「${f.text.slice(0,50)}」原因：${f.reason}`).join('\n'):'');
}

/* ============ 提示词① 拆分 ============ */
async function aiSplit(l){
  const act=activeProjects();
  const projects=act.map(p=>({id:p.id,name:p.name,desc:p.desc||p.cat}));
  const open=S.blockers.filter(b=>!b.solved&&P(b.pid)&&!P(b.pid).archived).map(b=>({id:b.id,project_id:b.pid,content:b.content}));
  const sys=persona()+`

任务：把用户今天的一段记录拆成结构化条目。只输出 JSON，不要任何解释。

【规则】
1. 一段话可能涉及多个项目，按项目拆开。一个项目也可以拆成多条。
2. 每条的 type 只能是：progress 进展 / gain 收获 / cost 付出 / blocker 磕绊 / idea 灵感 / note 其他
3. content 用一句话复述用户原意，保留关键细节和数字，不润色、不添加。
4. 时间和金钱只在用户明确说出时填写："两个半小时"→150，"花了380"→380；"一下午""挺贵的"这类不确定的填 null。时间和金钱可以填在对应的那条上，不必单独拆一条 cost。
5. 如果用户说某个问题解决了，并且能对上未解决磕绊里的某一条，填 resolves_blocker_id。
6. 如果用户又提到某个未解决磕绊、但没有解决（比如"还是报错""还没搞定"），填 mentions_blocker_id，这条的 type 用 blocker，代码会更新原磕绊，不会重复新建。
7. 对不上任何项目的内容：像是新项目就填 new_project_suggestion，否则 project_id 填 null。
8. 任何一处拿不准，needs_confirm 设为 true，并在 question 里用一句话问用户（口吻用你的人设）。
9. mood 判断整段话的情绪：good / neutral / low / very_low。${l.forcePid?`
10. 用户已经指定这段记录属于项目 ${l.forcePid}，所有条目的 project_id 都填它，不要建议新项目，也不用为归属问题确认。`:''}

【输出格式】
{"items":[{"project_id":"p1或null","new_project_suggestion":"名称或null","type":"progress","content":"……","time_minutes":数字或null,"money_yuan":数字或null,"resolves_blocker_id":"id或null","mentions_blocker_id":"id或null"}],"mood":"neutral","needs_confirm":false,"question":null}`;
  const user=`今天：${dkey(l.ts)}（周${WEEK[new Date(l.ts).getDay()]}）
项目列表：${JSON.stringify(projects)}
未解决磕绊：${JSON.stringify(open)}
用户原文：${l.raw}${l.voiceEmotion&&l.voiceEmotion!=='neutral'?`
（这段是语音转的文字，语音里听出的情绪是 ${l.voiceEmotion}，判断 mood 时可以参考，但以内容为准）`:''}`;
  const out=parseJSON(await chat([{role:'system',content:sys},{role:'user',content:user}],0.2));
  const ids=new Set(act.map(p=>p.id)),openIds=new Set(open.map(b=>b.id));
  const num=v=>v===null||v===undefined||v===''||isNaN(+v)?null:+v;
  let items=(out.items||[]).filter(i=>i&&i.content).map(i=>{
    let pid=l.forcePid||(ids.has(i.project_id)?i.project_id:null);
    const sug=!pid&&i.new_project_suggestion?String(i.new_project_suggestion).slice(0,20):null;
    const res=openIds.has(i.resolves_blocker_id)?i.resolves_blocker_id:null;
    const men=!res&&openIds.has(i.mentions_blocker_id)?i.mentions_blocker_id:null;
    return {id:uid('i'),pid,suggest:sug,type:TYPES[i.type]?i.type:'note',content:String(i.content),minutes:num(i.time_minutes),money:num(i.money_yuan),resolves:res,mentions:men};
  });
  if(!items.length)items=[{id:uid('i'),pid:l.forcePid||null,suggest:null,type:'note',content:l.raw.slice(0,80),minutes:null,money:null,resolves:null,mentions:null}];
  return {items,mood:MOODS[out.mood]?out.mood:'neutral',needsConfirm:!!out.needs_confirm,question:out.question||''};
}

/* ============ 一条记录的流程 ============ */
async function runLog(l){
  undoLog(l);
  l.status='splitting';l.stage='split';l.err='';l.reply='';save();render();
  try{
    const r=await aiSplit(l);
    Object.assign(l,{items:r.items,mood:r.mood,question:r.question});
    if(r.needsConfirm||l.items.some(i=>!i.pid)){l.status='confirm';save();render();openConfirm(l.id);return;}
    await commitLog(l);
  }catch(err){l.status='error';l.err=err.message||String(err);save();render();}
}
async function commitLog(l){
  // 新项目建议 → 创建项目
  const made={};
  l.items.forEach(i=>{if(typeof i.pid==='string'&&i.pid.startsWith('new:')){const name=i.pid.slice(4);
    if(!made[name]){const p=newProject({name});made[name]=p.id;}i.pid=made[name];}});
  l.items=l.items.filter(i=>i.pid&&P(i.pid));
  if(!l.items.length){S.logs=S.logs.filter(x=>x.id!==l.id);save();render();toast('没有要存的内容');return;}
  applyBlockers(l);
  l.spendAlert=spendAlert(l);
  l.status='replying';l.stage='reply';save();render();
  await replyLog(l);
  updateProfiles(logPids(l),l);
}
function applyBlockers(l){
  l.items.forEach(i=>{
    if(i.resolves){const b=B(i.resolves);if(b&&!b.solved){b.solved=true;b.solvedTs=l.ts;b.solvedBy=l.id;b.last=l.ts;}}
    else if(i.mentions){const b=B(i.mentions);if(b){b.prevLast=b.last;b.last=l.ts;}}
    else if(i.type==='blocker'){const b={id:uid('b'),pid:i.pid,content:i.content,solved:false,first:l.ts,last:l.ts,logId:l.id};S.blockers.push(b);i.blockerId=b.id;}
  });
}
function undoLog(l){
  S.blockers=S.blockers.filter(b=>b.logId!==l.id);
  S.blockers.forEach(b=>{if(b.solvedBy===l.id){b.solved=false;b.solvedTs=null;b.solvedBy=null;}});
}
function spendAlert(l){
  const d=new Date(l.ts);const m0=new Date(d.getFullYear(),d.getMonth(),1).getTime(),m1=new Date(d.getFullYear(),d.getMonth()+1,1).getTime(),mp=new Date(d.getFullYear(),d.getMonth()-1,1).getTime();
  const mk=dkey(m0).slice(0,7);const out=[];
  logPids(l).forEach(pid=>{
    const p=P(pid);if(!l.items.some(i=>i.pid===pid&&i.money))return;if(p.spendAlerted===mk)return;
    const cur=sumRange(pid,m0,m1).money,prev=sumRange(pid,mp,m0).money;
    if((prev>0&&cur>prev*1.5&&cur-prev>=200)||(prev===0&&cur>=500)){p.spendAlerted=mk;out.push(`本月「${p.name}」已花费 ${Math.round(cur)} 元，上月 ${Math.round(prev)} 元`);}
  });
  return out.join('；');
}

/* ============ 提示词② 回应 ============ */
async function replyLog(l){
  const pids=logPids(l);
  const exception=l.mode==='log_only'&&l.mood==='very_low';
  l.exception=exception;
  if(l.mode==='log_only'&&!exception){l.reply='记下了。';l.status='done';save();render();return;}
  const recent=S.logs.filter(x=>x.id!==l.id&&x.ts<l.ts&&x.status==='done'&&logPids(x).some(id=>pids.includes(id))).sort((a,b)=>b.ts-a.ts).slice(0,8).reverse();
  const mode=exception?'log_only（但 TA 今天情绪很低：破例只回一句轻轻的陪伴，不超过 30 字，不给方案，不追问）':l.mode;
  const sys=persona()+`

任务：回应用户今天的记录。直接输出要发给 TA 的话，不要任何前缀。

【先判断这条记录的分量，再决定怎么回】
优先级：情绪低落 > 新磕绊 > 解决了旧磕绊 / 明显进展 > 灵感 > 普通记录。
- 普通的一笔（小进展、记个账）：一句话，接住即可。
- 明显进展，或解决了旧磕绊：1～3 句。点出和之前比的变化，比如"上周卡了三天的那个"。
- 新磕绊：2～4 句。先承认它磨人，再问一个能帮 TA 理清的问题，或者给一条思路，二选一。
- 同一个磕绊持续 3 天以上：可以提议换个角度，但只提一次。
- 情绪低落（mood 为 low / very_low）：1～3 句，只陪伴，不给方案，不转移话题去夸进展。
- 灵感：1～2 句，接住它，再追问一个让它更具体的问题。
- 投入提示不为空：用一句话陈述事实，问是否在计划内。
- 涉及多个项目：挑最值得说的一两个，不必每个都回。
- 模式为 log_only：只回"记下了"或一个很短的确认。

【记忆的用法】
- 每次回应最多引用一处过去的内容，并且必须来自输入里的档案或记录。
- 不要每次都说"上次你提到"，只在过去和现在形成对比或呼应时用。

【长度和措辞】
- 总长度不超过 120 字，大多数时候远少于此。
- 不用列表、标题、引号框。
- 不重复最近记录里你已经说过的夸奖句式。${feedbackText()}`;
  const user=`现在：${dkey(l.ts)} 周${WEEK[new Date(l.ts).getDay()]} ${hm(l.ts)}
项目档案：
${profilesText(pids)}
最近记录：
${recent.map(x=>`- ${dkey(x.ts)}｜${logPids(x).map(id=>P(id).name).join('、')}｜${x.raw.slice(0,150)}${x.reply&&x.reply!=='记下了。'?'｜你当时回：'+x.reply.slice(0,60):''}`).join('\n')||'（无）'}
未解决磕绊：
${openBlockersText(pids)}
今天拆分结果：${JSON.stringify(l.items.map(i=>({project:P(i.pid)?.name,type:i.type,content:i.content,time_minutes:i.minutes,money_yuan:i.money,resolved:i.resolves?B(i.resolves)?.content:undefined,mentioned_again:i.mentions?B(i.mentions)?.content:undefined})))}
情绪：${l.mood}
今天原文：${l.raw}
投入提示：${l.spendAlert||'（无）'}
模式：${mode}`;
  try{l.reply=(await chat([{role:'system',content:sys},{role:'user',content:user}],0.8)).replace(/^["“]|["”]$/g,'');l.status='done';l.err='';}
  catch(err){l.status='error';l.stage='reply';l.err=err.message||String(err);}
  save();render();
}

/* ============ 提示词③ 档案 ============ */
async function updateProfiles(pids,l){
  for(const pid of pids){
    const p=P(pid);if(!p)continue;p.profiling=true;render();
    const sys=persona()+`

任务：根据今天的新记录，更新这个项目的档案。只输出 JSON。

【档案固定分为六段，每段 1～3 句，每段以编号和小标题开头，段与段之间换行】
1. 这是什么：项目是什么，TA 想达到什么（TA 说过才写）。
2. 现在走到哪：当前阶段，最近一次实质进展。
3. 一路的关键节点：最多 5 条，按时间排列，带日期，新的节点挤掉最不重要的旧节点。
4. TA 的投入方式：习惯在什么时候做、大致频率（金额总数由代码统计，这里不写数字）。
5. 反复出现的模式：反复卡的地方、反复冒出的念头。没有就写"暂无"。
6. 值得回访：TA 说过"下周要……""打算……"的事，以及值得过几天问一句的事。

【规则】
- 旧档案里仍然成立的保留，过时的删掉，矛盾的以今天为准。
- 只写 TA 说过的，不推测动机、不给评价。
- 档案全文不超过 400 字。
- 另外把第 6 段整理成 follow_ups 列表：每条一句话，due_date 按 TA 说的时间推算（"明天"→明天，"周末"→本周六，"下周"→下周一）；说"过几天"或没说时间的，填今天之后第 3 天；已经做完或过时的不要再列。最多 5 条。

【输出格式】
{"profile":"1. 这是什么：……\\n2. 现在走到哪：……\\n……","follow_ups":[{"content":"……","due_date":"YYYY-MM-DD"}]}`;
    const user=`今天：${dkey(Date.now())}（周${WEEK[new Date().getDay()]}）
项目：${p.name}，${p.desc||p.cat}
旧档案：${p.profile||'（空，这是第一次）'}
今天的条目：${JSON.stringify(l.items.filter(i=>i.pid===pid).map(i=>({type:i.type,content:i.content,time_minutes:i.minutes,money_yuan:i.money})))}
今天原文：${l.raw}
未解决磕绊：
${openBlockersText([pid])}
现有的待回访：${JSON.stringify(p.followUps.filter(f=>!f.done).map(f=>({content:f.content,due_date:f.due})))}`;
    try{
      const out=parseJSON(await chat([{role:'system',content:sys},{role:'user',content:user}],0.3));
      if(out.profile){p.profile=String(out.profile).slice(0,700);p.profileTs=Date.now();}
      if(Array.isArray(out.follow_ups)){
        const done=p.followUps.filter(f=>f.done).slice(-10);
        p.followUps=[...done,...out.follow_ups.filter(f=>f&&f.content).slice(0,5).map(f=>({id:uid('f'),content:String(f.content),
          due:/^\d{4}-\d\d-\d\d$/.test(f.due_date||'')?f.due_date:dkey(Date.now()+3*DAY),done:false,created:Date.now()}))];

  }
}

function openerCandidates(){
  const c=[],today=dkey(Date.now());
  activeProjects().forEach(p=>{
    if(p.lastAsked&&daysAgo(p.lastAsked)<3)return;
    const st=projStats(p.id);const n=daysAgo(st.last||p.created);
    if(n>=7)c.push({pid:p.id,project:p.name,kind:'stale',detail:st.last?`${n} 天没有记录了`:`建了 ${n} 天还没写过`,days:n});
    S.blockers.filter(b=>b.pid===p.id&&!b.solved&&daysAgo(b.last)>=3).forEach(b=>c.push({pid:p.id,project:p.name,kind:'blocker',detail:b.content,days:daysAgo(b.first),ref:b.id}));
    p.followUps.filter(f=>!f.done&&f.due<=today).forEach(f=>c.push({pid:p.id,project:p.name,kind:'follow_up',detail:f.content,days:daysAgo(f.created),ref:f.id}));

  const audio=await new Promise((res,rej)=>{const p=ac.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej);});
  try{ac.close();}catch(e){}
  const rate=16000,len=Math.max(1,Math.ceil(audio.duration*rate));
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;const off=new OAC(1,len,rate);
  const src=off.createBufferSource();src.buffer=audio;src.connect(off.destination);src.start(0);
  const rendered=await new Promise((res,rej)=>{off.oncomplete=e=>res(e.renderedBuffer);const p=off.startRendering();if(p&&p.then)p.then(res,rej);});
  const data=rendered.getChannelData(0),seg=150*rate,out=[];
  for(let i=0;i<data.length;i+=seg){let end=Math.min(i+seg,data.length);if(data.length-end<3*rate)end=data.length;out.push(encodeWav(data.subarray(i,end),rate));if(end===data.length)break;}
  return {parts:out,duration:audio.duration};
}
async function asrCall(blob){
  const r=await fetch(ASR_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+asrKey()},
    body:JSON.stringify({model:'qwen3-asr-flash',messages:[{role:'user',content:[{type:'input_audio',input_audio:{data:await toDataURI(blob)}}]}],stream:false,asr_options:{enable_itn:true}})});
  if(!r.ok){let t='';try{t=(await r.json()).error?.message||'';}catch(e){}throw new Error('语音识别返回 '+r.status+(t?'：'+t:'')+(r.status===401?'。检查百炼 API Key。':''));}
  const j=await r.json();const m=j.choices?.[0]?.message||{};
  return {text:(m.content||'').trim(),emotion:(m.annotations||[]).find(a=>a.emotion)?.emotion||''};
}
async function transcribe(blob){
  vbar('<span class="spin"></span><span class="vhint">正在转文字…</span>','busy');
  try{
    const {parts,duration}=await splitAudio(blob);
    if(duration<0.8){voiceIdle('太短了，没听清，再说一次。',true);return;}
    let text='';const emos=[];
    for(let i=0;i<parts.length;i++){
      if(parts.length>1)vbar(`<span class="spin"></span><span class="vhint">正在转文字… ${i+1}/${parts.length}</span>`,'busy');
      const r=await asrCall(parts[i]);text+=r.text;if(r.emotion)emos.push(r.emotion);
    }
    if(!text.trim()){voiceIdle('没识别到内容，再试一次。',true);return;}
    const ta=$('#ctext');if(!ta)return;
    ta.value=(ta.value.trim()?ta.value.replace(/\s+$/,'')+'\n':'')+text.trim();
    const neg=emos.find(e=>EMO[e]==='low'),pos=emos.find(e=>EMO[e]==='good');
    draft.voiceEmotion=neg||pos||emos[0]||'';
    afterVoice();
  }catch(e){voiceIdle(e.message||'转文字失败，再试一次。',true);}
}
function afterVoice(){
  if(S.settings.voiceAuto&&$('#ctext')&&$('#ctext').value.trim()){document.querySelector('[data-act="submit"]')?.click();return;}
  voiceIdle('转好了，可以改一改再点「写好了」，也可以接着说。');

  const dueN=fus.filter(f=>f.due<=today).length,oldN=open.filter(b=>daysAgo(b.first)>=3).length;
  let h=header('清单','你提到过的事，帮你分好了类。');

  <div class="lgroup"><span class="glabel">攒下来的</span><button class="ltab ${V.lt==='ideas'?'on':''}" data-lt="ideas">灵感<b>${nIdea}</b></button><button class="ltab ${V.lt==='gains'?'on':''}" data-lt="gains">收获<b>${nGain}</b></button></div></div>`;
  h+=`<div class="filters"><div class="frow"><span class="flabel">类别</span><div class="tabs"><button class="tab sm ${V.lcat==='all'?'on':''}" data-lcat="all">全部</button>${cats.map(c=>`<button class="tab sm ${V.lcat===c?'on':''}" data-lcat="${c}">${c}</button>`).join('')}</div></div>
  <div class="frow"><span class="flabel">项目</span><div class="tabs"><button class="tab sm ${V.lpid==='all'?'on':''}" data-lpid="all">全部</button>${projs.map(p=>`<button class="tab sm ${V.lpid===p.id?'on':''}" data-lpid="${p.id}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</button>`).join('')}</div></div></div>`;
  const filtered=V.lcat!=='all'||V.lpid!=='all';
  const none=(big,small)=>`<div class="empty">${big?`<span class="hand">${big}</span>`:''}${small}</div>`;
  if(V.lt==='stuck'){
    h+=open.map(blockItem).join('')||none(filtered?'':'眼下没有卡住的事',filtered?'这个范围里没有卡着的事。':'写记录时提到的困难，会自动出现在这里，卡得最久的排在最前面。');
    if(solved.length)h+=`<button class="fold" data-act="togglesolved">${V.showSolved?'收起':'展开'}已解决的 ${solved.length} 个 ${V.showSolved?'▴':'▾'}</button>`+(V.showSolved?solved.map(blockItem).join(''):'');
  }
  if(V.lt==='todo')h+=fus.map(fuItem).join('')||none(filtered?'':'没有说过要做的事',filtered?'这个范围里没有。':`你在记录里说"打算……""下周要……"，${AN()}会记在这里，到时候问你一句。`);
  if(V.lt==='ideas'){
    h+=ideasLive.map(ideaItem).join('')||none(filtered?'':'灵感池还是空的',filtered?'这个范围里没有新的灵感。':`天马行空的想法也写进记录里，${AN()}会帮你收好。点 ☆ 留着，不想要了就放下。`);
    const rest=ideasAll.filter(i=>i.state==='project'||i.state==='drop');
    if(rest.length)h+=`<button class="fold" data-act="toggleideas">${V.ideaAll?'收起':'看看'}变成项目和放下的 ${rest.length} 个 ${V.ideaAll?'▴':'▾'}</button>`+(V.ideaAll?rest.map(ideaItem).join(''):'');
  }
  if(V.lt==='gains'){
    if(!gains.length)h+=none(filtered?'':'还没攒下收获',filtered?'这个范围里还没有收获。':'学到的、得到的、让你开心的事，会自动收在这里。哪天低落了，回来翻翻。');
    else{let last='';gains.forEach(g=>{const m=dkey(g.ts).slice(0,7);if(m!==last){h+=`<div class="day">${m.replace('-','年')}月</div>`;last=m;}h+=gainItem(g);});}
  }
  return h;
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,[data-act]');if(!t)return;
  const d=t.dataset;
  if(d.nav){V.tab=d.nav;V.replyOpen=null;render();scrollTo(0,0);return;}
  if(d.filter){V.filter=d.filter;render();return;}
  if(d.lt){V.lt=d.lt;render();return;}
  if(d.golist){const p=P(d.golist);V.tab='lists';V.lt='gains';V.lcat='all';V.lpid=d.golist;render();scrollTo(0,0);return;}
  if(d.lcat){V.lcat=d.lcat;V.lpid='all';render();return;}
  if(d.lpid){V.lpid=d.lpid;render();return;}
  if(d.istar){const i=findItem(d.istar);if(i){i.ideaState=i.ideaState==='star'?'new':'star';save();render();toast(i.ideaState==='star'?'留着了':'取消留着');}return;}
  if(d.idrop){const i=findItem(d.idrop);if(i){i.ideaState='drop';save();render();toast('放下了，想要可以再捡回来');}return;}
  if(d.ireset){const i=findItem(d.ireset);if(i){i.ideaState='new';i.toPid=null;save();render();}return;}
  if(d.open){V.tab='project';V.pid=d.open;render();scrollTo(0,0);return;}
  if(d.pick){draft.pid=d.pick;document.querySelectorAll('[data-pick]').forEach(b=>b.classList.toggle('on',b.dataset.pick===d.pick));return;}
  if(d.cpick){const [k,pid]=d.cpick.split('|');cdraft.items[+k].pid=pid;renderConfirm();return;}
  if(d.confirm){openConfirm(d.confirm);return;}
  if(d.pcat){pdraft.cat=d.pcat;document.querySelectorAll('[data-pcat]').forEach(b=>b.classList.toggle('on',b.dataset.pcat===d.pcat));return;}
  if(d.pcolor){pdraft.color=d.pcolor;document.querySelectorAll('[data-pcolor]').forEach(b=>b.classList.toggle('on',b.dataset.pcolor===d.pcolor));return;}
  if(d.replyopen){V.replyOpen=V.replyOpen===d.replyopen?null:d.replyopen;render();setTimeout(()=>document.querySelector('[data-reply] input')?.focus(),50);return;}
  if(d.rereply){const l=L(d.rereply);if(l){l.status='replying';render();replyLog(l);}return;}
  if(d.retry){const l=L(d.retry);if(!l)return;if(l.stage==='reply'&&l.items.length){l.status='replying';render();replyLog(l).then(()=>updateProfiles(logPids(l),l));}else runLog(l);return;}
  if(d.askai){const l=L(d.askai);if(l){l.mode='normal';l.status='replying';render();replyLog(l);}return;}
  if(d.edit){composeSheet(null,d.edit);return;}
  if(d.del){if(confirm('删除这条记录？它带来的磕绊变化也会撤回。')){const l=L(d.del);if(l)removeLog(l);save();render();}return;}
  if(d.delrev){S.reviews=S.reviews.filter(r=>r.id!==d.delrev);save();render();return;}
  if(d.rate){const [ref,kind,v]=d.rate.split('|');const src=kind==='reply'?L(ref)?.reply:kind==='opener'?S.opener?.text:S.reviews.find(r=>r.id===ref)?.text;
    setRating(ref,kind,src||'',v);V.reasonFor=rating(ref)?ref:null;render();return;}
  if(d.reason){const [ref,r]=d.reason.split('|');const f=rating(ref);if(f){f.reason=r;save();}V.reasonFor=null;render();toast('记下了，下次会注意');return;}
  if(d.toggle){const b=B(d.toggle);if(b){b.solved=!b.solved;b.solvedTs=b.solved?Date.now():null;b.solvedBy=null;save();render();toast(b.solved?'又解决一个':'已改回未解决');}return;}
  if(d.solveop){const b=B(d.solveop);if(b){b.solved=true;b.solvedTs=Date.now();S.opener.dismissed=true;save();render();toast('太好了，又解决一个');}return;}
  if(d.fudone||d.fudrop){const id=d.fudone||d.fudrop;S.projects.forEach(p=>{const f=p.followUps.find(x=>x.id===id);if(f){if(d.fudone)f.done=true;else p.followUps=p.followUps.filter(x=>x.id!==id);}});
    if(S.opener&&S.opener.ref===id)S.opener.dismissed=true;save();render();toast(d.fudone?'好，记下了':'不再问这件事');return;}
  if(d.idea2proj){const i=findItem(d.idea2proj);if(i){projSheet(null,i.content.slice(0,20));pdraft.fromIdea=i.id;$('#pdesc').value=i.content;}return;}
  if(d.editproj){projSheet(d.editproj);return;}
  if(d.arch){const p=P(d.arch);p.archived=!p.archived;save();render();toast(p.archived?'已归档':'已恢复');return;}
  if(d.delproj){if(confirm('删除项目会同时删除它的全部记录，确定？')){const id=d.delproj;S.projects=S.projects.filter(p=>p.id!==id);
    S.logs.forEach(l=>l.items=l.items.filter(i=>i.pid!==id));S.logs=S.logs.filter(l=>l.items.length||l.status!=='done');S.blockers=S.blockers.filter(b=>b.pid!==id);save();closeSheet();V.tab='projects';render();}return;}
  if(d.preset){const pr=PRESETS[d.preset];S.settings.preset=d.preset;if(d.preset!=='custom'){$('#s_base').value=pr.base;$('#s_model').value=pr.model;}document.querySelectorAll('[data-preset]').forEach(b=>b.classList.toggle('on',b.dataset.preset===d.preset));return;}
  if(d.voice){S.settings.voice=d.voice;save();render();return;}
  if(d.tone){S.settings.tone=d.tone;save();render();toast('说话风格：'+TONES[d.tone].label);return;}
  const act=d.act;if(!act)return;
  if(act==='close'){closeSheet();return;}
  if(act==='togglesolved'){V.showSolved=!V.showSolved;render();return;}
  if(act==='toggleideas'){V.ideaAll=!V.ideaAll;render();return;}
  if(act==='voice'){startVoice();return;}
  if(act==='voicestop'){stopVoice();return;}
  if(act==='voicecancel'){cancelVoice();return;}
  if(act==='quickvoice'){if(!activeProjects().length){projSheet();return;}composeSheet(null,null,{voice:true});startVoice();return;}
  if(act==='compose'){composeSheet();return;}
  if(act.startsWith('compose:')){composeSheet(act.slice(8));return;}
  if(act==='newproj'){projSheet();return;}
  if(act==='review'){weeklyReview(false);return;}
  if(act==='dismissop'){S.opener.dismissed=true;save();render();return;}
  if(act==='confirmsave'){saveConfirm();return;}
  if(act==='confirmedit'){const l=L(cdraft.id);composeSheet(null,l.id);return;}
  if(act==='clearfb'){if(confirm('清空所有评价记录？')){S.feedback=[];save();render();}return;}
  if(act==='submit'){
    if(REC){toast('先点「说完了」');return;}
    const raw=$('#ctext').value.trim();if(!raw){toast('先写点什么');return;}
    const mode=$('#cquiet').checked?'log_only':'normal';const forcePid=draft.pid==='auto'?null:draft.pid;

    if(l){undoLog(l);Object.assign(l,{raw,mode,forcePid,items:[],reply:'',thread:[],exception:false});S.feedback=S.feedback.filter(f=>f.ref!==l.id);}
    else{l={id:uid('e'),ts:Date.now(),raw,mode,forcePid,items:[],mood:'neutral',reply:'',status:'splitting',thread:[],voiceEmotion:draft.voiceEmotion||''};S.logs.push(l);}
    save();closeSheet();if(V.tab!=='project')V.tab='home';scrollTo(0,0);runLog(l);return;
  }
  if(act==='saveproj'){
    const name=$('#pname').value.trim();if(!name){toast('给项目起个名字');return;}
    const desc=$('#pdesc').value.trim();
    if(pdraft.id){Object.assign(P(pdraft.id),{name,desc,cat:pdraft.cat,color:pdraft.color});}
    else{const p=newProject({name,desc,cat:pdraft.cat,color:pdraft.color});V.tab='project';V.pid=p.id;
      if(pdraft.fromIdea){const i=findItem(pdraft.fromIdea);if(i){i.ideaState='project';i.toPid=p.id;}}}
    save();closeSheet();render();toast(pdraft.id?'已保存':'项目已创建');return;
  }
  if(act==='savecfg'||act==='testcfg'){
    Object.assign(S.settings,{base:$('#s_base').value.trim(),model:$('#s_model').value.trim(),key:$('#s_key').value.trim()});save();
    if(act==='savecfg'){toast('已保存');makeOpener(false);return;}
    toast('测试中…');chat([{role:'user',content:'用一句话（20字内）跟我打个招呼'}]).then(r=>alert('连接成功：\n'+r)).catch(e=>alert(e.message));return;
  }
  if(act==='exportmd'){download(toMarkdown(),'项目手记-'+dkey(Date.now())+'.md','text/markdown');return;}
  if(act==='export'){download(JSON.stringify({...S,settings:{...S.settings,key:'',asrKey:''}},null,1),'项目手记备份-'+dkey(Date.now())+'.json','application/json');return;}
  if(act==='import'){$('#impfile').click();return;}
  if(act==='wipe'){if(confirm('清空全部项目和记录？此操作不能撤销。')&&confirm('再确认一次：真的清空？')){const st=S.settings;S=blank();S.settings=st;save();render();}return;}
});
$('#mask').addEventListener('click',ev=>{if(ev.target.id==='mask')closeSheet();});
$('#fab').addEventListener('click',()=>composeSheet());
document.addEventListener('submit',ev=>{const f=ev.target;
  if(f.dataset.reply){ev.preventDefault();const t=f.t.value.trim();const l=L(f.dataset.reply);if(t&&l){V.replyOpen=null;followUp(l,t);}}
  if(f.dataset.reasonform){ev.preventDefault();const r=rating(f.dataset.reasonform);if(r){r.reason=f.t.value.trim()||(r.v==='bad'?'没说':'');save();}V.reasonFor=null;render();toast('记下了，下次会注意');}
});
document.addEventListener('input',ev=>{const k=ev.target.dataset?.citem;if(k!==undefined&&cdraft)cdraft.items[+k].content=ev.target.value;});
document.addEventListener('change',ev=>{
  if(ev.target.id==='impfile'){const f=ev.target.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!d.projects)throw 0;
    const key=S.settings.key;S=d.v===3?fixup(d):migrate(d);if(!S.settings.key)S.settings.key=key;save();render();toast('已恢复 '+S.logs.length+' 条记录');}).catch(()=>alert('这个文件不是项目手记的备份。'));}
  const k=ev.target.dataset?.setting;if(k){S.settings[k]=ev.target.value.trim()||(k==='aiName'?'小记':'');save();render();}
  const c=ev.target.dataset?.check;if(c){S.settings[c]=ev.target.checked;save();}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet();if((ev.metaKey||ev.ctrlKey)&&ev.key==='Enter'&&$('#ctext')&&$('#mask').classList.contains('show'))document.querySelector('[data-act="submit"]')?.click();});

// 启动：恢复中断的请求
S.logs.forEach(l=>{if(l.status==='splitting'||l.status==='replying'){l.stage=l.status==='replying'?'reply':'split';l.status='error';l.err='上次没等到就关掉了，点「重试」。';}l.replying=false;});
S.reviews.forEach(r=>{if(r.status==='pending'){r.status='error';r.text='上次没生成完。';}});
if(S.opener&&S.opener.status==='pending')S.opener=null;
save();render();
makeOpener(false);
maybeAutoReview();

</script>
